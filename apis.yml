name: 7 Cups
description: >-
  7 Cups is an online emotional support and mental health platform founded in
  July 2013 by psychologist Glen Moriarty (Y Combinator S13) and based in Palo
  Alto, California. It connects people seeking help with trained volunteer
  "listeners" for free, anonymous, 24/7 one-to-one active-listening chat, and
  also offers community forums, group support chat rooms, self-help growth
  paths, and affordable online therapy with licensed therapists via messaging.
  The service reports reaching tens of millions of people across roughly 190
  countries, supported by hundreds of thousands of trained volunteer listeners,
  and sells organizational solutions for schools, employers, and health plans.
  7 Cups does not publish a public developer API or developer portal; this
  profile captures its public identity and web properties for the API
  Evangelist network.
